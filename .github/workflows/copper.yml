name: "QUILL"
run-name: "Mica"
"on":
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  id-token: write
  pages: write
  contents: read
concurrency:
  group: "THORN-${{ github.workflow }}"
  cancel-in-progress: true
jobs:
  Opal:
    runs-on: ubuntu-24.04
    environment:
      name: "github-pages"
      url: ${{ steps.RAVEN.outputs.page_url }}
    steps:
      - name: "Reef"
        uses: actions/checkout@v5
      - name: "SPRING"
        uses: actions/configure-pages@v5
      - name: "Caldera"
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}
      - name: "COASTLINE"
        id: RAVEN
        uses: actions/deploy-pages@v4
